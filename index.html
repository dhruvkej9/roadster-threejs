<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Teleoperator — Roadster (Three.js)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f0f10;
    font-family:ui-monospace,Menlo,monospace;touch-action:none;overscroll-behavior:none}
  canvas{display:block}
  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));
       color:#e6edf5;font-size:12px;line-height:1.7;background:rgba(10,12,16,.72);
       padding:8px 12px;border-radius:10px;border:1px solid #262b33;pointer-events:none;z-index:5}
  #gasbar{height:6px;width:min(46vw,170px);background:#1b2029;border-radius:4px;margin-top:4px;overflow:hidden}
  #gasfill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#67e8f9);transition:width .12s}

  /* touch controls: hidden unless the device actually has no hover pointer */
  #pad{position:fixed;left:0;bottom:0;width:46vw;height:42vh;z-index:6;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
        background:rgba(103,232,249,.30);border:2px solid rgba(103,232,249,.75);pointer-events:none}
  #ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
        border-radius:50%;border:1px dashed rgba(103,232,249,.30);pointer-events:none}
  .btn{position:fixed;z-index:6;width:20vw;max-width:96px;height:20vw;max-height:96px;border-radius:50%;
       display:grid;place-items:center;color:#d7f6ff;font-size:min(7vw,26px);font-weight:700;
       background:rgba(20,26,34,.78);border:2px solid rgba(103,232,249,.5);touch-action:none;user-select:none}
  #bUp{right:calc(20vw + 14px);bottom:calc(22vh + 16px)}
  #bDn{right:14px;bottom:calc(22vh + 16px)}
  .btn.on{background:rgba(103,232,249,.42);color:#04131a}
  #hint{position:fixed;bottom:6px;left:10px;color:#8b98a8;font-size:10px;line-height:1.5;pointer-events:none;z-index:5}
  #boots{position:fixed;inset:0;display:grid;place-items:center;background:#0f0f10;color:#67e8f9;
         font-size:13px;letter-spacing:.16em;z-index:9}
  body:not(.touch) #pad,body:not(.touch) .btn{display:none}
  body.touch #hint{display:none}
</style>
</head>
<body>
<div id="boots">LOADING CITY…</div>
<div id="hud">
  <div>SPD <b id="spd">0</b> &nbsp; ALT <b id="alt">0</b> &nbsp; <b id="mode">GROUND</b></div>
  <div>NITROGEN</div>
  <div id="gasbar"><div id="gasfill"></div></div>
</div>

<div id="pad"><div id="ring"></div><div id="knob"></div></div>
<div class="btn" id="bUp">▲</div>
<div class="btn" id="bDn">▼</div>

<div id="hint">W/S throttle · A/D steer · SPACE up · SHIFT down · R reset &nbsp;|&nbsp; phone: left pad drives, ▲▼ fly</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const el = id => document.getElementById(id);
const hud = { spd:el('spd'), alt:el('alt'), mode:el('mode'), gas:el('gasfill'), boots:el('boots') };

// ponytail: coarse pointer == phone/tablet. 1388 separate meshes + a 2048 shadow map
// is exactly what melts a mid-range phone, so drop both instead of micro-optimising.
const TOUCH = matchMedia('(pointer:coarse)').matches;
if (TOUCH) document.body.classList.add('touch');

// ---------------- renderer (must exist before the loop) ----------------
const renderer = new THREE.WebGLRenderer({ antialias:!TOUCH, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, TOUCH ? 1.5 : 2));
renderer.shadowMap.enabled = !TOUCH;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f10);
scene.fog = new THREE.Fog(0x0f0f10, 90, TOUCH ? 260 : 420);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 3000);
camera.position.set(0, 6, 16);

scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x12151b, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(70, 110, 45);
sun.castShadow = !TOUCH;
if (!TOUCH) {
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left:-160, right:160, top:160, bottom:-160, far:400 });
}
scene.add(sun);

// ---------------- city ----------------
const BLOCK = 60, N = TOUCH ? 8 : 13;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000),
  new THREE.MeshStandardMaterial({ color:0x14181e, roughness:.96 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = !TOUCH; scene.add(ground);

const bMat   = new THREE.MeshStandardMaterial({ color:0x2a3038, roughness:.85, metalness:.1 });
const bMat2  = new THREE.MeshStandardMaterial({ color:0x353c46, roughness:.8,  metalness:.1 });
const winMat = new THREE.MeshBasicMaterial({ color:0x8fd0ff });

let buildingCount = 0;
for (let gx = -N; gx <= N; gx++) for (let gz = -N; gz <= N; gz++) {
  if (gx === 0 && gz === 0) continue;
  const cx = gx * BLOCK, cz = gz * BLOCK;
  const seed = (Math.abs(gx * 73856093) ^ Math.abs(gz * 19349663)) >>> 0;
  const count = 1 + (seed % 3);
  for (let i = 0; i < count; i++) {
    const r2 = (seed >> (i * 3)) >>> 0;
    const h  = 12 + (r2 % 78), w = 8 + ((r2 >> 4) % 12), d = 8 + ((r2 >> 8) % 12);
    const ox = ((r2 >> 12) % 10) - 5, oz = ((r2 >> 16) % 10) - 5;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), (seed + i) % 2 ? bMat : bMat2);
    m.position.set(cx + ox, h/2, cz + oz);
    m.castShadow = !TOUCH; m.receiveShadow = !TOUCH;
    scene.add(m); buildingCount++;
    if (!TOUCH) {                      // window strips are decoration only; skip on phone
      const strip = new THREE.Mesh(new THREE.BoxGeometry(w*1.005, 1.2, d*1.005), winMat);
      strip.position.set(cx + ox, h*(0.35 + (i%3)*0.22), cz + oz);
      scene.add(strip);
    }
  }
}
const grid = new THREE.GridHelper(BLOCK*(N+1), (N+1)*2, 0x2c3540, 0x1a1f26);
scene.add(grid);

// ---------------- the Roadster ----------------
const car = new THREE.Group(); scene.add(car);
const shell  = new THREE.MeshStandardMaterial({ color:0xe6ecf2, metalness:.9, roughness:.25 });
const glass  = new THREE.MeshStandardMaterial({ color:0x0b1622, metalness:.5, roughness:.05 });
const carbon = new THREE.MeshStandardMaterial({ color:0x15191f, metalness:.7, roughness:.45 });
const box = (w,h,d,mat,x=0,y=0,z=0) => { const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.castShadow=!TOUCH; return m; };

car.add(box(2.0,0.30,4.4, shell, 0,0.55,0));
car.add(box(1.9,0.22,4.0, shell, 0,0.80,-0.05));
const nose = box(1.6,0.20,1.5, shell, 0,0.72,2.35); nose.rotation.x = -0.13; car.add(nose);
car.add(box(1.5,0.34,1.9, glass, 0,1.05,-0.35));

const tyre = new THREE.MeshStandardMaterial({ color:0x0a0c10, roughness:.95 });
const rim  = new THREE.MeshStandardMaterial({ color:0xa8bccc, metalness:.95, roughness:.2 });
for (const [x,z] of [[-1,1.35],[1,1.35],[-1,-1.35],[1,-1.35]]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.26,16), tyre);
  w.rotation.z = Math.PI/2; w.position.set(x,.36,z); w.castShadow=!TOUCH; car.add(w);
  const h = new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.27,12), rim);
  h.rotation.z = Math.PI/2; h.position.set(x,.36,z); car.add(h);
}

// cold-gas thrusters "around the perimeter" per Tesla's wording; count is our pick (no published spec)
const THRUSTERS = [[0,.55,2.3],[0,.55,-2.3],[-1.05,.55,1.2],[-1.05,.55,-1.2],
                   [1.05,.55,1.2],[1.05,.55,-1.2],[-.6,.30,2.15],[.6,.30,2.15],
                   [-1,.9,.1],[1,.9,.1]];
const flames = [];
for (const [x,y,z] of THRUSTERS) {
  const n = new THREE.Mesh(new THREE.CylinderGeometry(.075,.10,.14,8), carbon);
  n.rotation.x = Math.PI/2; n.position.set(x,y,z); car.add(n);
  const f = new THREE.Mesh(new THREE.ConeGeometry(.08,1.1,8),
    new THREE.MeshBasicMaterial({ color:0x67e8f9, transparent:true, opacity:.9 }));
  f.rotation.x = -Math.PI/2; f.position.set(x,y,z-.58); f.visible = false;
  car.add(f); flames.push(f);
}

// ---------------- input: keyboard OR touch into one state ----------------
const kb = new Set();
const tc = { steer:0, throttle:0, up:false, down:false };
const HOME = new THREE.Vector3(0, 0.02, 0);
const s = { pos:HOME.clone(), yaw:0, vel:0, vy:0, gas:100, flying:false };

addEventListener('keydown', e => {
  kb.add(e.code);
  if (e.code === 'KeyR') { s.pos.copy(HOME); s.yaw=0; s.vel=0; s.vy=0; }
});
addEventListener('keyup', e => kb.delete(e.code));

// --- virtual stick: drag anywhere in the left 46% of the screen ---
const pad = el('pad'), knob = el('knob');
const RADIUS = 62;
let padId = null, padCx = 0, padCy = 0, padR = 60;

function stickMove(ev){
  const dx = ev.clientX - padCx, dy = ev.clientY - padCy;
  const len = Math.hypot(dx, dy) || 1;
  const k = Math.min(len, padR) / padR;
  const ux = dx/len, uy = dy/len;
  knob.style.transform = `translate(${ux*k*RADIUS}px, ${uy*k*RADIUS}px)`;
  tc.steer    = -ux * k;          // drag right -> steer right
  tc.throttle = -uy * k;          // drag up    -> accelerate
}
pad.addEventListener('pointerdown', ev => {
  padId = ev.pointerId; pad.setPointerCapture(padId);
  const r = pad.getBoundingClientRect();
  padCx = r.left + r.width * 0.5; padCy = r.top + r.height * 0.5;
  padR = Math.min(r.width, r.height) * 0.42;
  stickMove(ev); ev.preventDefault();
});
pad.addEventListener('pointermove', ev => { if (ev.pointerId === padId) stickMove(ev); });
function stickEnd(ev){
  if (ev.pointerId !== padId) return;
  padId = null; knob.style.transform = '';
  tc.steer = 0; tc.throttle = 0;
}
pad.addEventListener('pointerup', stickEnd);
pad.addEventListener('pointercancel', stickEnd);

// --- up / down buttons ---
function hold(btn, key){
  const set = v => { tc[key] = v; btn.classList.toggle('on', v); };
  btn.addEventListener('pointerdown', ev => { btn.setPointerCapture(ev.pointerId); set(true); ev.preventDefault(); });
  btn.addEventListener('pointerup',     () => set(false));
  btn.addEventListener('pointercancel', () => set(false));
  btn.addEventListener('pointerleave',  () => set(false));
}
hold(el('bUp'), 'up');
hold(el('bDn'), 'down');

function readInput(){
  return {
    thr:  (kb.has('KeyW')?1:0) - (kb.has('KeyS')?1:0) || tc.throttle,
    turn: (kb.has('KeyA')?1:0) - (kb.has('KeyD')?1:0) || tc.steer,
    up:   kb.has('Space') || tc.up,
    down: kb.has('ShiftLeft') || kb.has('ShiftRight') || tc.down,
  };
}

// ponytail: no building collision — free-roam sandbox. Add AABB sweep when it matters.
function update(dt){
  const { thr, turn, up, down } = readInput();

  if (turn) s.yaw += turn * 1.85 * dt * Math.sign(s.vel || 1);
  if (thr)  s.vel += thr * 44 * dt;
  s.vel *= (1 - 1.5*dt);
  s.vel = THREE.MathUtils.clamp(s.vel, -16, 68);

  const grounded = s.pos.y <= HOME.y + 0.001 && s.vy <= 0;
  let burn = 0;
  if (up && s.gas > 0)       { s.vy += 27*dt; s.gas -= 15*dt; burn = 1; }
  if (down && s.pos.y > 0.1) { s.vy -= 23*dt; burn = Math.max(burn,.45); }
  // ponytail: refuel + ground-clamp must NOT run while ascending, or SPACE kills the
  // lift it just added and the car can never take off from a standstill.
  if (grounded && !up) { s.gas = Math.min(100, s.gas + 20*dt); s.vy = 0; }
  s.gas = THREE.MathUtils.clamp(s.gas, 0, 100);
  s.vy -= 15*dt; s.pos.y += s.vy*dt;
  if (s.pos.y < HOME.y) { s.pos.y = HOME.y; s.vy = 0; }

  s.flying = !grounded;
  s.pos.x += Math.sin(s.yaw) * s.vel * dt;
  s.pos.z += Math.cos(s.yaw) * s.vel * dt;

  car.position.copy(s.pos);
  car.rotation.y = s.yaw;
  car.rotation.x = THREE.MathUtils.lerp(car.rotation.x,
    -thr*0.045 + (s.flying ? -s.vy*0.011 : 0), 6*dt);

  for (const f of flames) {
    f.visible = burn > 0;
    if (f.visible) { f.scale.set(1, burn*(0.75+Math.random()*0.55), 1);
                     f.material.opacity = .5 + Math.random()*.45; }
  }

  const back = new THREE.Vector3(Math.sin(s.yaw), 0, Math.cos(s.yaw)).multiplyScalar(-13);
  camera.position.lerp(s.pos.clone().add(back).add(new THREE.Vector3(0,5,0)), 1-Math.pow(.002, dt));
  camera.lookAt(s.pos.x, s.pos.y + 1.2, s.pos.z);

  hud.spd.textContent  = (s.vel*3.6).toFixed(0);
  hud.alt.textContent  = s.pos.y.toFixed(0);
  hud.mode.textContent = grounded ? 'GROUND' : (s.gas<=0 ? 'DRY' : 'FLIGHT');
  hud.gas.style.width  = s.gas + '%';
}

const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  update(Math.min(clock.getDelta(), .05));
  renderer.render(scene, camera);
})();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

hud.boots.style.display = 'none';
// one runnable check: flight rules, city, and touch input must all boot sane
console.assert(THRUSTERS.length === 10, 'thruster count changed');
console.assert(buildingCount > 100, `city too small: ${buildingCount}`);
console.assert(s.gas === 100 && s.pos.y === HOME.y, 'must boot landed with full tank');
console.assert(tc.steer === 0 && tc.throttle === 0 && !tc.up && !tc.down, 'touch state must start neutral');
window.__ready = true; window.__buildings = buildingCount; window.__touch = TOUCH;
</script>
</body>
</html>
